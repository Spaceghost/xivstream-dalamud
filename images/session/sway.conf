# xivstream: the Wolf session's sway, nested on Wolf's compositor. Not a
# desktop: everything is fullscreen on the one output Wolf streams. The output
# line and the exec lines are added by session.sh.

default_border none
default_floating_border none
gaps inner 0
focus_follows_mouse no
# Nothing may steal the output from the game.
for_window [app_id=".*"] fullscreen enable
for_window [class=".*"] fullscreen enable

# The client's relative mouse carries movement its own desktop has already
# accelerated; accelerating it again here makes the pointer too fast.
input type:pointer {
    accel_profile flat
    pointer_accel 0
}
