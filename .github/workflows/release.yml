name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token that may push to Spaceghost/homebrew-tap, scoop-bucket and winget-pkgs.
          # Without it the release still publishes; only those manifests are skipped.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
  wolf-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # The Wolf session image without an Incus guest's files (XIVLauncher.Core
          # is downloaded). `xivstream apply` builds its own locally by default.
          context: images/session
          file: images/session/Containerfile
          push: true
          tags: |
            ghcr.io/spaceghost/xivstream-session:latest
            ghcr.io/spaceghost/xivstream-session:${{ github.ref_name }}
