name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/xivstream
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Install isolated package-test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap rpm libarchive-tools binutils zstd
      - name: Check packaged CPU policy without a real service or game
        run: bash tools/check_cpu_packages.sh dist
      - name: Check Ghostty owner helper in an isolated synthetic home
        run: |
          xivstream_owner_gate=$(mktemp -d "$RUNNER_TEMP/xivstream-owner.XXXXXX")
          go build -o "$xivstream_owner_gate/xivstream" ./cmd/xivstream
          python3 tools/test_ghostty_owner_package.py --binary "$xivstream_owner_gate/xivstream"
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # Fails when go.mod/go.sum changed without updating flake.nix's vendorHash.
      - run: nix build .#xivstream -L && ./result/bin/xivstream version
      - run: nix flake check
